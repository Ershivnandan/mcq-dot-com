version: '3.8'

# ==============================================================================
# MCQ Quiz Manager - Docker Setup
# ==============================================================================
# NOTE: You are using MongoDB Atlas in the cloud.
# Your database is hosted on MongoDB Atlas, so no local database container
# is needed. The Next.js app connects directly via your DATABASE_URL in .env.
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcq-quiz-manager
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped

  # Optional: Local MongoDB container (ONLY if you want to test offline without Atlas)
  # mongodb:
  #   image: mongo:7.0
